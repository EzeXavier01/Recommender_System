      #   run: |
      #     docker tag catawiki-recsys:${{ github.sha }} your-registry/catawiki-recsys:latest
      #     docker push your-registry/catawiki-recsys:latest
      #     ssh user@your-server "docker compose pull && docker compose up -d"
